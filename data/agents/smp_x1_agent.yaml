agent_name: "SMP"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05

  critic_net: "fc_2layers_1024units"

actor_optimizer:
    type: "Adam"
    learning_rate: 3e-4

critic_optimizer:
    type: "Adam"
    learning_rate: 3e-4

discount: 0.99
steps_per_iter: 32
iters_per_output: 5000  # r11: > total iters, so the ONLY model.pt write is the final one (SDK first-.pt slot)
test_episodes: 32
normalizer_samples: 100000000
use_mixed_precision: false

actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2

td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0
critic_loss_weight: 1.0

smp_eval_batch_size: 4096
# dm_worker r4 fix (branch dm/smp-reward-fix):
# r3 (TASK_20261002_060) froze: DiffNormalizer.normalize=x/mean_abs is
# self-normalizing, so mean sds_loss_norm ~= 1 always, and
# smp_r = exp(-1*6) ~= 0.0025 with tiny relative spread. Combined with
# SGD lr=1e-4 the actor gradient (~1e-3 * 1e-4) is effectively zero.
# Fix: soften kernel exp(-2z) (r~0.13 typical, ~50x larger spread),
# switch to AdamW 3e-4, and add 0.5*w task (DeepMimic-style tracking)
# for a dense absolute signal alongside the diffusion prior kernel.
sds_loss_scale: 2
diffusion_steps: [22, 15, 8]

enable_gsi: False

task_reward_weight: 0.5
smp_reward_weight: 1.0

smp_prior_cfg: "tools/diffusion_model/config/tinymdm_x1_multi_clip.yaml"
smp_prior_model: "data/models/smp_priors/x1_prior.pt"
